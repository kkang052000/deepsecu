<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="naver-site-verification" content="3c5bd4193cb7968bf94887206303c40dadd91c03" />
<meta name="description" content="딥시큐(DeepSecu)는 공공기관 통합 IT 인프라 구축 자문, PMO, 공공데이터 및 정보보안·개인정보보호 종합 컨설팅 전문 기업입니다.">
<title>딥시큐 DeepSecu | IT 인프라 구축 자문 · PMO · 공공데이터 컨설팅</title>

<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">

<link rel="icon" href="/favicon.ico" type="image/x-icon">
<style>
:root {
  --bg-light: #ffffff;
  --bg-gray: #f5f8fc;      
  --bg-banner: linear-gradient(135deg, #e4effb 0%, #f0f6fd 50%, #f7faff 100%);
  
  --text-main: #0a1128;    
  --text-muted: #2d3748;   
  --text-light: #4a5568;   
  
  --accent: #1e6fcf;       
  --bright: #1b7cf2;       
  --cyan: #008cb8;         
  
  --card-bg: rgba(255, 255, 255, 0.85);
  --border: #cbd5e1;       
  --shadow: rgba(10, 17, 40, 0.06);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}

body {
  background: var(--bg-light);
  color: var(--text-main);
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
  letter-spacing: -0.03em;
  line-height: 1.6;
  overflow-x: hidden;
}

#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;}

/* 🗺️ NAV */
nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 60px;height:68px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);
  border-bottom:2px solid var(--border);
  transition:background .3s;
}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer;}
.nav-logo svg{width:30px;height:30px;}
.nav-logo span{font-family:'Plus Jakarta Sans', sans-serif;font-size:1.45rem;font-weight:800;color:var(--text-main);letter-spacing:-0.5px;}
.nav-logo span em{color:var(--accent);font-style:normal;}

/* GNB */
.gnb{display:flex;list-style:none;gap:0;margin-left:40px;}
.gnb > li{position:relative;}
.gnb > li > a{
  display:flex;align-items:center;gap:4px;
  height:68px;padding:0 20px;
  color:var(--text-muted);font-size:.92rem;font-weight:700;
  text-decoration:none;transition:color .2s;
  border-bottom:2px solid transparent;
}
.gnb > li > a:hover,.gnb > li > a.active{color:var(--accent);border-bottom-color:var(--accent);}

/* 드롭다운 */
.dropdown{
  position:absolute;top:68px;left:0;
  min-width:210px;
  background:rgba(255,255,255,.98);
  border:1px solid var(--border);
  border-top:3px solid var(--accent);
  border-radius:0 0 8px 8px;
  padding:8px 0;
  opacity:0;visibility:hidden;
  transform:translateY(-6px);
  transition:all .2s;
  backdrop-filter:blur(12px);
  box-shadow:0 12px 30px rgba(11, 19, 43, 0.15);
}
.gnb > li:hover .dropdown{opacity:1;visibility:visible;transform:translateY(0);}
.dropdown a{
  display:block;padding:10px 20px;
  color:var(--text-muted);font-size:.88rem;font-weight:600;
  text-decoration:none;transition:all .2s;
  border-left:2px solid transparent;
}
.dropdown a:hover{color:var(--accent);background:rgba(30,111,207,.08);border-left-color:var(--accent);}

.nav-right{display:flex;align-items:center;gap:16px;}
.nav-tel{font-size:.85rem;color:var(--text-muted);letter-spacing:0;font-weight:600;}
.nav-tel span{color:var(--accent);font-weight:800;}
.nav-cta{
  background:linear-gradient(135deg,var(--accent),var(--bright));
  color:#fff;padding:9px 22px;border-radius:6px;
  font-size:.88rem;font-weight:700;text-decoration:none;
  transition:all .3s;box-shadow:0 4px 14px rgba(30,111,207,.3);
}
.nav-cta:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(30,111,207,.45);}

/* 📄 PAGE SYSTEM */
.page{display:none;min-height:100vh;padding-top:68px;}
.page.active{display:block;}

.page-banner{
  position:relative;z-index:1;
  padding:80px 60px 60px;
  background: var(--bg-banner);
  border-bottom:1px solid var(--border);
  overflow:hidden;
}
.page-banner::before{
  content:'';position:absolute;inset:0;
  background-image: linear-gradient(rgba(30,111,207,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(30,111,207,.03) 1px, transparent 1px);
  background-size: 40px 40px;
  mask-image: radial-gradient(circle at 80% 50%, black, transparent 75%);
  -webkit-mask-image: radial-gradient(circle at 80% 50%, black, transparent 75%);
}
.page-banner::after{
  content:'';position:absolute;top:-20%;right:-5%;
  width:450px;height:450px;
  background:radial-gradient(circle,rgba(30,111,207,.15) 0%,transparent 70%);
  border-radius:50%;
}
.page-banner .breadcrumb{
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size:.8rem;color:var(--text-light);letter-spacing:0.5px;
  margin-bottom:14px;font-weight:700;position:relative;z-index:2;
}
.page-banner .breadcrumb span{color:var(--accent);}
.page-banner h1{
  font-size:clamp(2.2rem,4vw,3.2rem);font-weight:800;
  color:var(--text-main);letter-spacing:-0.04em;margin-bottom:12px;position:relative;z-index:2;
}
.page-banner p{color:var(--text-muted);font-size:1rem;font-weight:500;line-height:1.5;position:relative;z-index:2;}

/* 🏢 COMMON SECTION */
.sec{position:relative;z-index:1;padding:95px 60px;}
.sec-label{font-family:'Plus Jakarta Sans', sans-serif;font-size:.8rem;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:12px;font-weight:700;}
.sec-title{font-size:clamp(1.9rem,3vw,2.6rem);font-weight:800;color:var(--text-main);margin-bottom:16px;letter-spacing:-0.04em;line-height:1.25;}
.sec-desc{color:var(--text-muted);font-size:.98rem;line-height:1.8;max-width:620px;font-weight:500;}
.inner{max-width:1200px;margin:0 auto;}

.btn-p{background:linear-gradient(135deg,var(--accent),var(--bright));color:#fff;padding:14px 30px;border-radius:6px;text-decoration:none;font-weight:700;font-size:.95rem;transition:all .3s;box-shadow:0 4px 20px rgba(30,111,207,.3);border:none;cursor:pointer;display:inline-block;}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(30,111,207,.45);}
.btn-o{border:2px solid var(--accent);color:var(--accent);padding:14px 30px;border-radius:6px;text-decoration:none;font-weight:700;font-size:.95rem;transition:all .3s;display:inline-block;background:#ffffff;}
.btn-o:hover{background:rgba(30,111,207,.08);border-color:var(--bright);color:var(--bright);}

.card {
  background:var(--card-bg);
  backdrop-filter: blur(10px);
  border:1px solid rgba(203, 213, 225, 0.7);
  border-radius:14px;padding:36px 32px;
  box-shadow:0 6px 20px var(--shadow);
  transition:all .35s;
}
.card:hover{border-color:var(--bright);transform:translateY(-6px);box-shadow:0 18px 40px rgba(30,111,207,.15);}

/* 🏠 HOME PAGE */
#page-home .hero{
  position:relative;z-index:1;
  min-height:calc(100vh - 68px);
  display:flex;align-items:center;
  padding:90px 60px;overflow:hidden;
  background: radial-gradient(circle at 80% 20%, #eaf3fc 0%, #f4f8fd 40%, #ffffff 80%);
}
.hero-grid{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(30,111,207,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(30,111,207,.06) 1px,transparent 1px);
  background-size:55px 55px;
  mask-image: linear-gradient(to bottom, black, transparent);
  -webkit-mask-image: linear-gradient(to bottom, black, transparent);
  animation:gridScroll 22s linear infinite;
}
@keyframes gridScroll{from{background-position:0 0}to{background-position:55px 55px}}
.hero-glow{position:absolute;top:10%;right:5%;width:550px;height:550px;background:radial-gradient(circle,rgba(30,111,207,.16) 0%,transparent 70%);border-radius:50%;animation:glowPulse 5s ease-in-out infinite;}
@keyframes glowPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.15);opacity:0.9}}

.hero-content{position:relative;max-width:760px;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(30,111,207,.08);border:1px solid rgba(30,111,207,.25);padding:6px 18px;border-radius:20px;font-size:.76rem;color:var(--accent);letter-spacing:1px;text-transform:uppercase;margin-bottom:28px;font-weight:700;animation:fadeUp .7s ease both;}
.hero-badge::before{content:'';width:6px;height:6px;background:var(--bright);border-radius:50%;animation:blink 1.6s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
.hero-title{font-size:clamp(2.5rem,5vw,4.2rem);font-weight:900;line-height:1.2;color:var(--text-main);letter-spacing:-0.04em;margin-bottom:20px;animation:fadeUp .7s .1s ease both;}
.hero-title .hl{color:var(--accent);}
.hero-sub{font-size:1.1rem;color:var(--text-muted);line-height:1.8;margin-bottom:40px;font-weight:500;animation:fadeUp .7s .2s ease both;}
.hero-btns{display:flex;gap:14px;animation:fadeUp .7s .3s ease both;}

.hero-stats{
  position:absolute;right:60px;bottom:60px;
  display:flex;gap:40px;
  animation:fadeUp .7s .4s ease both;
}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:3rem;color:var(--accent);line-height:1;letter-spacing:1px;}
.stat-label{font-size:.78rem;color:var(--text-light);margin-top:4px;font-weight:700;}

.home-services{
  background:var(--bg-gray);
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
}
.home-services::before {
  content: ''; position: absolute; inset: 0;
  background-image: radial-gradient(#1e6fcf 0.5px, transparent 0.5px);
  background-size: 24px 24px; opacity: 0.25;
  mask-image: linear-gradient(to right, transparent, black 50%, transparent);
  -webkit-mask-image: linear-gradient(to right, transparent, black 50%, transparent);
}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:50px;}
.svc-card{position:relative;overflow:hidden;}
.svc-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--bright));transform:scaleX(0);transform-origin:left;transition:transform .4s;}
.svc-card:hover::before{transform:scaleX(1);}
.svc-num{font-family:'Bebas Neue',sans-serif;font-size:3.8rem;color:rgba(30,111,207,.08);position:absolute;top:12px;right:18px;line-height:1;}
.svc-icon{width:48px;height:48px;background:rgba(30,111,207,.08);border:1px solid rgba(30,111,207,.2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin-bottom:18px;}
.svc-title{font-size:1.1rem;font-weight:700;color:var(--text-main);margin-bottom:10px;}
.svc-desc{font-size:.88rem;color:var(--text-muted);line-height:1.7;margin-bottom:18px;font-weight:500;}
.svc-tags{display:flex;flex-wrap:wrap;gap:5px;}
.tag{background:rgba(30,111,207,.06);border:1px solid rgba(30,111,207,.2);color:var(--accent);font-size:.72rem;padding:3px 10px;border-radius:4px;font-weight:700;}
.svc-more{display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-size:.85rem;font-weight:700;cursor:pointer;margin-top:16px;border:none;background:none;transition:gap .2s;}
.svc-more:hover{gap:10px;}

.home-numbers{background:var(--bg-light); position: relative;}
.home-numbers::before {
  content: ''; position: absolute; top:0; left: 10%; width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(0, 200, 255, 0.05) 0%, transparent 70%);
}
.num-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-top:50px;position: relative; z-index: 2;}
.num-item{background:var(--card-bg);padding:38px 28px;text-align:center;}
.num-big{font-family:'Bebas Neue',sans-serif;font-size:3.8rem;color:var(--accent);line-height:1;margin-bottom:6px;letter-spacing:1px;}
.num-label{font-size:.88rem;color:var(--text-muted);line-height:1.6;font-weight:700;}

/* 🏢 COMPANY PAGE */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center;}
.about-feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:34px;}
.feat-card{background:var
